name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install psutil (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m pip install psutil
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: doctor
        run: python ai_presence.py doctor
      - name: detect
        run: python ai_presence.py detect
      - name: setup --dry-run
        if: runner.os != 'Linux'
        run: python ai_presence.py setup --dry-run
      - name: Package installs
        run: python -m pip install . && agent-presence --help
